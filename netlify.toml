# Netlify builds the single-file version of the game on every push.
# Set the five NEXT_PUBLIC_FIREBASE_* variables under Site configuration → Environment variables.
[build]
  command = "npm run build:site"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The site is the single-file build in dist/, not a Next.js deployment.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
